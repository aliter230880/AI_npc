# Aliterra Character Platform — added by Kiro
ai.aliterra.space {
	encode gzip

	# API → FastAPI на 8001 (без префикса /api на бэкенде)
	handle_path /api/* {
		reverse_proxy 127.0.0.1:8001 {
			# нужно для SSE-стрима чата
			flush_interval -1
			transport http {
				keepalive 60s
			}
		}
	}

	# SPA — раздаём собранный фронт. История react-router работает через try_files.
	handle {
		root * /opt/character-platform/web
		try_files {path} /index.html
		file_server
	}

	# базовая защитa security headers
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		# не светим заголовок Server
		-Server
	}
}
